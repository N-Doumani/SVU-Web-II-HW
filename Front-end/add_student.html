<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة طالب جديد - نظام الطلاب</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-success text-white py-3">
                        <h5 class="fw-bold m-0"><i class="fa-solid fa-user-plus me-2"></i>إضافة سجل طالب جديد (AJAX Enabled)</h5>
                    </div>
                    <div class="card-body p-4">
                        <form id="addStudentForm" action="dashboard.html" method="GET" enctype="multipart/form-data">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">الاسم الكامل <span class="text-danger">*</span></label>
                                    <input type="text" id="studentName" name="name" class="form-control" placeholder="مثال: خالد العبدالله" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">البريد الإلكتروني <span class="text-danger">*</span></label>
                                    <input type="email" id="studentEmail" name="email" class="form-control" placeholder="student@example.com" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">رقم الهاتف <span class="text-danger">*</span></label>
                                    <input type="text" id="studentPhone" name="phone" class="form-control" placeholder="099xxxxxxx" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">العنوان</label>
                                    <input type="text" id="studentAddress" name="address" class="form-control" placeholder="المحافظة - المنطقة">
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold">الصورة الشخصية (اختياري)</label>
                                    <input type="file" id="studentPhoto" name="profile_picture" class="form-control" accept="image/*">
                                </div>
                            </div>
                            <div class="mt-4 text-end">
                                <a href="dashboard.html" class="btn btn-secondary rounded-pill me-2">إلغاء</a>
                                <button type="submit" class="btn btn-success rounded-pill px-4 fw-bold">حفظ الطالب</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
