<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الأدمن - نظام الطلاب</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-primary text-white text-center py-4">
                        <i class="fa-solid fa-user-shield fa-3x mb-2"></i>
                        <h4 class="fw-bold m-0">تسجيل دخول الإدارة</h4>
                    </div>
                    <div class="card-body p-4">
                        <form id="loginForm" action="dashboard.html" method="GET">
                            <div class="mb-3">
                                <label class="form-label fw-bold">اسم المستخدم أو البريد الإلكتروني</label>
                                <input type="text" name="username_email" class="form-control rounded-3" placeholder="admin@svu.edu.sy" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">كلمة المرور</label>
                                <input type="password" id="loginPassword" name="password" class="form-control rounded-3" placeholder="••••••••" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold shadow">
                                <i class="fa-solid fa-right-to-bracket me-2"></i>دخول لوحة التحكم
                            </button>
                        </form>
                        <hr class="my-4">
                        <div class="text-center">
                            <a href="register.html" class="text-decoration-none me-3">إنشاء حساب جديد</a> | 
                            <a href="index.html" class="text-decoration-none ms-3">العودة للبوابة الرئيسية</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
